[versions]
# Build tools
agp = "9.2.1"                 # AGP 9.2: supports compileSdk 37, needs Gradle 9.4.1+
kotlin = "2.4.20"             # Compose compiler plugin uses the Kotlin version

# AndroidX
composeBom = "2026.08.00"     # Compose 1.12 (needs AGP 9.2+ and compileSdk 37)
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.1"
datastore = "1.3.0"
splashscreen = "1.0.1"

# Google
adsNextGen = "1.7.0"          # Google Mobile Ads Next-Gen SDK (AdMob)
ump = "4.0.0"                 # User Messaging Platform (GDPR / US-state consent)
playReview = "2.0.2"          # Google Play In-App Review

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

google-ads-nextgen = { group = "com.google.android.libraries.ads.mobile.sdk", name = "ads-mobile-sdk", version.ref = "adsNextGen" }
google-ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
google-play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
